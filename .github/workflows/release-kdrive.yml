name: Build kDrive Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "kdrive-test"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            binary: rclone.exe
            archive: rclone-windows-amd64.zip

          - os_name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: rclone
            archive: rclone-linux-amd64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      # WinFsp is required at runtime for `rclone mount`.
      # The Developer feature is also useful/required when building
      # against WinFsp headers/libraries.
      - name: Install WinFsp
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress

      - name: Build
        shell: bash
        run: |
          export GOOS="${{ matrix.goos }}"
          export GOARCH="${{ matrix.goarch }}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            export CGO_ENABLED=0

            echo "Building Windows with cmount..."
            go build \
              -tags cmount \
              -trimpath \
              -ldflags="-s -w" \
              -o "${{ matrix.binary }}" \
              .

          else
            export CGO_ENABLED=0

            echo "Building Linux..."
            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${{ matrix.binary }}" \
              .
          fi

      - name: Verify Windows mount command
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          .\rclone.exe version

          Write-Host ""
          Write-Host "Checking mount command..."
          .\rclone.exe help mount

          if ($LASTEXITCODE -ne 0) {
            Write-Error "rclone mount was not included in the Windows build."
            exit 1
          }

      - name: Verify Linux build
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          ./rclone version
          ./rclone help mount

      - name: Package Windows
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          7z a "${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Package Linux
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          tar czf "${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: rclone kDrive ${{ inputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/windows-amd64/rclone-windows-amd64.zip
            release/linux-amd64/rclone-linux-amd64.tar.gz
